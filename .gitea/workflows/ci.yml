name: CI

on:
  push:
    branches: ["**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SPEC_TOKEN }}

      - run: git -C spec fetch --tags origin

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.5

      - run: bun install --frozen-lockfile
      - run: bun run check:contract-tag
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun test
      - run: bun run build
